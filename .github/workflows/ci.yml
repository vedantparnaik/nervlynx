name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run smoke matrix
        if: matrix.python-version == '3.11'
        run: robot-core smoke-matrix --output-dir logs/smoke_matrix
      - name: Contracts check
        if: matrix.python-version == '3.11'
        run: robot-core contracts-check
      - name: Contracts codegen
        if: matrix.python-version == '3.11'
        run: robot-core contracts-codegen
      - name: Validate core graph packs
        if: matrix.python-version == '3.11'
        run: robot-core graph-validate-core
      - name: Verify core graph pack files exist
        if: matrix.python-version == '3.11'
        run: robot-core graph-list-core --verify-exists
      - name: Run core graph packs
        if: matrix.python-version == '3.11'
        run: robot-core graph-run-core --output-dir logs/core_graph_runs
      - name: Graph run
        if: matrix.python-version == '3.11'
        run: robot-core run-graph deploy/config/graph_surveillance.yaml --output logs/graph_trace.jsonl
      - name: Chaos pass
        if: matrix.python-version == '3.11'
        run: robot-core chaos-pass --drop-probability 0.1 --mutate-probability 0.1
      - name: Distributed demo
        if: matrix.python-version == '3.11'
        run: robot-core distributed-demo
      - name: Deterministic replay check
        if: matrix.python-version == '3.11'
        run: python benchmarks/check_deterministic_replay.py --seed tests/fixtures/replay/seed_trace.jsonl --expected tests/fixtures/replay/expected_trace.jsonl --output logs/replay_actual_trace.jsonl
      - name: Benchmark baseline check
        if: matrix.python-version == '3.11'
        run: python benchmarks/benchmark_runtime.py --loops 5000 --output-json logs/benchmark_runtime.json --baseline benchmarks/baselines/reference_runtime_v0.2.0.json --max-regression-pct 35
      - name: Validate live graphs
        if: matrix.python-version == '3.11'
        run: robot-core live-validate examples/live/*.yaml
      - name: Live rover simulation (strict)
        if: matrix.python-version == '3.11'
        run: robot-core run-live examples/live/rover_sim.yaml --sim-time --duration-s 30 --run-dir logs/live/rover_sim --strict --quiet
      - name: Live executor benchmark
        if: matrix.python-version == '3.11'
        run: python benchmarks/benchmark_live.py --tick-seconds 2 --output-json logs/benchmark_live.json
      - name: Upload production-confidence artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v6
        with:
          name: production-confidence-${{ github.run_id }}
          path: |
            logs/benchmark_runtime.json
            logs/benchmark_live.json
            logs/replay_actual_trace.jsonl
            logs/core_graph_runs/*.jsonl
            logs/live/rover_sim/report.json
            logs/live/rover_sim/report.md

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install core only (no extras)
        run: |
          python -m pip install -U pip
          pip install . pytest
      - name: Core install must not pull in pyzmq or pycapnp
        run: |
          python -c "import importlib.util as u, sys; leaked = [m for m in ('zmq', 'capnp') if u.find_spec(m)]; sys.exit(f'installed without an extra: {leaked}' if leaked else 0)"
      - name: Run tests
        run: pytest -q
      - name: Live rover simulation
        run: robot-core run-live examples/live/rover_sim.yaml --sim-time --duration-s 10 --run-dir logs/live/minimal --strict --quiet

  ros2-bridge:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v5
      - name: Install into a venv that can see ROS 2
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-venv python3-pip
          python3 -m venv --system-site-packages /opt/nlx
          /opt/nlx/bin/pip install -U pip
          /opt/nlx/bin/pip install . pytest
      - name: Round trip through ROS 2 Humble
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          /opt/nlx/bin/python -m pytest -q tests/test_ros2_live.py tests/test_ros2_bridge.py -rs

  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S cpp_core -B cpp_core/build
      - name: Build
        run: cmake --build cpp_core/build
      - name: Smoke executable
        run: ./cpp_core/build/smoke_surveillance
      - name: CTest
        run: ctest --test-dir cpp_core/build --output-on-failure
